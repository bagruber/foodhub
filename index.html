<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Speisekarten Moosburg</title>
    <meta
      name="description"
      content="Die Speisekarten der Moosburger Gastronomie an einem Ort. Nach Gericht suchen statt nach Restaurant, mit Angabe, woher jede Karte stammt und wie alt sie ist."
    />
    <!-- Die Vektorkacheln und der Kartenstil kommen von dort. Der Handschlag
         laeuft damit schon, bevor die erste Anfrage abgeht. -->
    <link rel="preconnect" href="https://sgx.geodatenzentrum.de" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Zählung von moosburg.eu, absoluter Pfad, damit alle Projekte dieselbe
         Datei bekommen. Ohne Cookie und ohne Speicher im Browser; der
         Endpunkt nimmt nur Anfragen mit der Origin moosburg.eu an, deshalb
         läuft der Aufruf auf GitHub Pages absichtlich ins Leere. Die App hat
         nur eine Ansicht, ein Routenwechsel ist nicht zu melden. -->
    <script src="/assets/zaehler.js" defer></script>
  </body>
</html>
